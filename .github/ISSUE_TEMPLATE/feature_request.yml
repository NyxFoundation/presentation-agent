name: Feature request
description: Suggest a new pipeline stage, prompt improvement, theme change, or other enhancement.
title: "[Feature] "
labels: ["enhancement"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for the suggestion. The most useful feature requests start
        from a concrete problem or limitation you ran into — that helps
        us evaluate whether the proposed change is the right fix.

  - type: textarea
    id: problem
    attributes:
      label: Problem / use case
      description: What are you trying to do, and what gets in the way today?
      placeholder: "When generating decks for academic audiences, the pipeline tends to..."
    validations:
      required: true

  - type: textarea
    id: proposal
    attributes:
      label: Proposed solution
      description: How would you like the pipeline to behave?
      placeholder: "Add a new stage between 03 and 04 that..."
    validations:
      required: true

  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
      description: Other approaches you thought about and why this one is preferred.

  - type: textarea
    id: extra
    attributes:
      label: Additional context
      description: Links, screenshots, prior art, related issues — anything else that helps.

  - type: checkboxes
    id: checks
    attributes:
      label: Pre-flight checks
      options:
        - label: I searched existing issues and could not find a duplicate.
          required: true
