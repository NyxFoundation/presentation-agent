name: Presentation Pipeline

on:
  workflow_dispatch:
    inputs:
      # No inputs needed - all configuration is in inputs/introduction.md frontmatter
      # This workflow is triggered manually and uses the current state of the repository

jobs:
  generate-presentation:
    # Restrict who can dispatch this workflow. By default workflow_dispatch
    # is allowed for anyone with Write access to the repo; this allowlist
    # tightens it to named maintainers. To extend, add the GitHub username
    # to the JSON array. For org-level enforcement, see the
    # "Maintainer Setup" section of README.md (environment-based gate).
    if: contains(fromJson('["grandchildrice"]'), github.actor)
    runs-on: self-hosted

    permissions:
      contents: write
      pull-requests: write

    env:
      # Claude Code configuration
      CLAUDE_CODE_PERMISSIONS: bypassPermissions
      CLAUDE_CODE_MAX_OUTPUT_TOKENS: 100000
      # Browser authentication is assumed to be completed on the self-hosted runner
      # No API key needed - uses existing claude login session

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Verify claude command is available
        run: |
          which claude || echo "claude not found in PATH"
          claude --version || echo "Failed to get claude version"

      - name: Validate input file
        run: make validate

      - name: Extract metadata from introduction.md
        id: extract-metadata
        run: |
          INPUT_FILE="inputs/introduction.md"

          # Extract target_audience from YAML frontmatter
          TARGET_AUDIENCE=$(grep -m1 "^target_audience:" "$INPUT_FILE" | sed 's/^target_audience:[[:space:]]*//' | sed 's/^"//' | sed 's/"$//')
          echo "target_audience=${TARGET_AUDIENCE}" >> $GITHUB_OUTPUT

          # Extract constraints (max_slides and max_duration_minutes)
          MAX_SLIDES=$(grep -m1 "max_slides:" "$INPUT_FILE" | sed 's/^[[:space:]]*max_slides:[[:space:]]*//')
          MAX_DURATION=$(grep -m1 "max_duration_minutes:" "$INPUT_FILE" | sed 's/^[[:space:]]*max_duration_minutes:[[:space:]]*//')
          CONSTRAINTS="${MAX_SLIDES} slides max, ${MAX_DURATION}-minute presentation"
          echo "constraints=${CONSTRAINTS}" >> $GITHUB_OUTPUT

          # Extract output_language
          OUTPUT_LANGUAGE=$(grep -m1 "^output_language:" "$INPUT_FILE" | sed 's/^output_language:[[:space:]]*//')
          echo "output_language=${OUTPUT_LANGUAGE}" >> $GITHUB_OUTPUT

          echo "Extracted metadata:"
          echo "  Target Audience: ${TARGET_AUDIENCE}"
          echo "  Constraints: ${CONSTRAINTS}"
          echo "  Output Language: ${OUTPUT_LANGUAGE}"

      - name: Create output directories
        run: make init

      - name: Run full pipeline
        run: make all

      - name: Create branch and push generated files
        id: create-branch
        run: |
          BRANCH_NAME="presentation/generated-${{ github.run_id }}-$(date +%Y%m%d-%H%M%S)"
          echo "branch_name=${BRANCH_NAME}" >> $GITHUB_OUTPUT

          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          git checkout -b "${BRANCH_NAME}"
          # outputs/ and slides/ are gitignored so contributor PRs stay clean;
          # the bot force-adds them only on `presentation/*` branches.
          git add -f outputs/ slides/
          git commit -m "Generate presentation outputs

          Target: ${{ steps.extract-metadata.outputs.target_audience }}
          Constraints: ${{ steps.extract-metadata.outputs.constraints }}
          Run ID: ${{ github.run_id }}"

          git push origin "${BRANCH_NAME}"

      - name: Create Pull Request
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TARGET_AUDIENCE="${{ steps.extract-metadata.outputs.target_audience }}"
          CONSTRAINTS="${{ steps.extract-metadata.outputs.constraints }}"

          gh pr create \
            --title "Presentation: ${TARGET_AUDIENCE}" \
            --body "$(cat <<'EOF'
          ## Generated Presentation

          **Target Audience:** ${{ steps.extract-metadata.outputs.target_audience }}
          **Constraints:** ${{ steps.extract-metadata.outputs.constraints }}
          **Output Language:** ${{ steps.extract-metadata.outputs.output_language }}

          ### Generated Files
          - \`outputs/\` - Pipeline intermediate outputs (JSON)
          - \`slides/\` - Final Slidev markdown files

          ### Review Checklist
          - [ ] Review slide content in \`slides/\`
          - [ ] Check executive review in \`outputs/08_Executive_Review.json\`
          - [ ] Verify visual designs in \`outputs/07_Visual_Designs.json\`

          ---
          *Generated by Presentation Pipeline (Run ID: ${{ github.run_id }})*
          EOF
          )" \
            --base main \
            --head "${{ steps.create-branch.outputs.branch_name }}"

      - name: Upload logs as artifact
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: pipeline-logs
          path: outputs/logs/
          retention-days: 7
