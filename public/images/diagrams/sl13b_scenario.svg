<svg viewBox="0 0 980 400" xmlns="http://www.w3.org/2000/svg" font-family="'Noto Sans JP', system-ui, sans-serif">
  <defs>
    <marker id="ar" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto"><path d="M0,0 L9,3 L0,6 Z" fill="#374151"/></marker>
    <marker id="arb" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto"><path d="M0,0 L9,3 L0,6 Z" fill="#2563eb"/></marker>
    <marker id="arg" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto"><path d="M0,0 L9,3 L0,6 Z" fill="#6b7280"/></marker>
    <marker id="arr" markerWidth="12" markerHeight="12" refX="10" refY="4" orient="auto"><path d="M0,0 L10,4 L0,8 Z" fill="#dc2626"/></marker>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="2" stdDeviation="2" flood-opacity="0.18"/>
    </filter>
  </defs>

  <!-- ========== CUSTOMER A (left) ========== -->
  <g>
    <rect x="20" y="6" width="150" height="20" rx="10" fill="#2563eb"/>
    <text x="95" y="20" text-anchor="middle" fill="white" font-size="12" font-weight="700">eMode Group A · LST</text>

    <circle cx="55" cy="55" r="13" fill="#2563eb"/>
    <path d="M 42 67 Q 55 65 68 67 L 66 92 L 44 92 Z" fill="#2563eb"/>
    <text x="55" y="110" text-anchor="middle" font-size="13" font-weight="700" fill="#111827">顧客 A</text>
    <text x="55" y="123" text-anchor="middle" font-size="10" fill="#6b7280">健全な借り手</text>

    <path d="M 75 78 Q 110 76 145 82" stroke="#1e40af" stroke-width="1.8" fill="none" marker-end="url(#arb)"/>
    <text x="111" y="71" text-anchor="middle" font-size="10" fill="#1e40af">担保</text>

    <g transform="translate(145, 42)" filter="url(#shadow)">
      <path d="M 5 25 Q 60 5 115 25" fill="#bfdbfe" stroke="#1e40af" stroke-width="2"/>
      <rect x="5" y="25" width="110" height="55" rx="3" fill="#dbeafe" stroke="#1e40af" stroke-width="2"/>
      <line x1="5" y1="42" x2="115" y2="42" stroke="#1e40af" stroke-width="1.5"/>
      <rect x="50" y="38" width="20" height="16" rx="2" fill="#1e40af"/>
      <circle cx="60" cy="48" r="2.5" fill="#fbbf24"/>
      <text x="60" y="68" text-anchor="middle" font-size="13" font-weight="700" fill="#1e3a8a" font-family="monospace">stSUI 50M</text>
    </g>

    <rect x="20" y="143" width="240" height="22" rx="11" fill="#059669" filter="url(#shadow)"/>
    <text x="140" y="159" text-anchor="middle" fill="white" font-size="11" font-weight="700">✓ Group A 借入 30M &lt; 閾値 50M</text>

    <text x="200" y="185" text-anchor="middle" font-size="12" fill="#1e40af" font-weight="700">借入 USDC 30M</text>
    <path d="M 200 193 Q 320 220 420 245" stroke="#2563eb" stroke-width="2.5" fill="none" marker-end="url(#arb)" stroke-dasharray="5,4"/>
    <circle cx="275" cy="213" r="9" fill="#fbbf24" stroke="#92400e" stroke-width="1.2"/>
    <text x="275" y="217" text-anchor="middle" font-size="11" font-weight="700" fill="#92400e">$</text>
  </g>

  <!-- ========== CUSTOMER B (right) ========== -->
  <g>
    <rect x="810" y="6" width="150" height="20" rx="10" fill="#6b7280"/>
    <text x="885" y="20" text-anchor="middle" fill="white" font-size="12" font-weight="700">eMode Group B · ETH</text>

    <circle cx="925" cy="55" r="13" fill="#6b7280"/>
    <path d="M 912 67 Q 925 65 938 67 L 936 92 L 914 92 Z" fill="#6b7280"/>
    <text x="925" y="110" text-anchor="middle" font-size="13" font-weight="700" fill="#111827">顧客 B</text>
    <text x="925" y="123" text-anchor="middle" font-size="10" fill="#9ca3af">別グループ</text>

    <path d="M 905 78 Q 870 76 835 82" stroke="#4b5563" stroke-width="1.8" fill="none" marker-end="url(#arg)"/>
    <text x="869" y="71" text-anchor="middle" font-size="10" fill="#4b5563">担保</text>

    <g transform="translate(720, 42)" filter="url(#shadow)">
      <path d="M 5 25 Q 60 5 115 25" fill="#e5e7eb" stroke="#4b5563" stroke-width="2"/>
      <rect x="5" y="25" width="110" height="55" rx="3" fill="#f3f4f6" stroke="#4b5563" stroke-width="2"/>
      <line x1="5" y1="42" x2="115" y2="42" stroke="#4b5563" stroke-width="1.5"/>
      <rect x="50" y="38" width="20" height="16" rx="2" fill="#4b5563"/>
      <circle cx="60" cy="48" r="2.5" fill="#fbbf24"/>
      <text x="60" y="68" text-anchor="middle" font-size="13" font-weight="700" fill="#1f2937" font-family="monospace">wETH 100M</text>
    </g>

    <text x="780" y="185" text-anchor="middle" font-size="12" fill="#4b5563" font-weight="700">借入 USDC 80M</text>
    <path d="M 780 193 Q 660 220 560 245" stroke="#6b7280" stroke-width="2.5" fill="none" marker-end="url(#arg)" stroke-dasharray="5,4"/>
    <circle cx="705" cy="213" r="9" fill="#fbbf24" stroke="#92400e" stroke-width="1.2"/>
    <text x="705" y="217" text-anchor="middle" font-size="11" font-weight="700" fill="#92400e">$</text>
  </g>

  <!-- ========== USDC RESERVE VAULT (center) ========== -->
  <g transform="translate(340, 220)" filter="url(#shadow)">
    <path d="M 10 30 Q 150 0 290 30" fill="#374151" stroke="#000" stroke-width="2.5"/>
    <rect x="10" y="30" width="280" height="80" rx="6" fill="#1f2937" stroke="#000" stroke-width="2.5"/>
    <line x1="10" y1="55" x2="290" y2="55" stroke="#000" stroke-width="2"/>
    <rect x="135" y="48" width="30" height="22" rx="3" fill="#fbbf24" stroke="#000" stroke-width="1.5"/>
    <circle cx="150" cy="62" r="3.5" fill="#000"/>
    <line x1="150" y1="62" x2="150" y2="68" stroke="#000" stroke-width="2"/>
    <circle cx="40" cy="88" r="10" fill="#fbbf24" stroke="#92400e" stroke-width="1.5"/>
    <text x="40" y="93" text-anchor="middle" font-size="12" font-weight="700" fill="#92400e">$</text>
    <circle cx="60" cy="98" r="7" fill="#fbbf24" stroke="#92400e" stroke-width="1"/>
    <circle cx="260" cy="88" r="10" fill="#fbbf24" stroke="#92400e" stroke-width="1.5"/>
    <text x="260" y="93" text-anchor="middle" font-size="12" font-weight="700" fill="#92400e">$</text>
    <circle cx="240" cy="98" r="7" fill="#fbbf24" stroke="#92400e" stroke-width="1"/>
    <text x="150" y="83" text-anchor="middle" font-size="12" font-weight="700" fill="#e5e7eb">USDC reserve</text>
    <text x="150" y="103" text-anchor="middle" font-size="22" font-weight="900" fill="#fbbf24" font-family="monospace">30M + 80M = 110M</text>
  </g>

  <!-- ========== SCALE / JUDGMENT (:580) ========== -->
  <g transform="translate(70, 350)">
    <text x="0" y="0" font-size="11" font-family="monospace" fill="#dc2626" font-weight="700">market.move :580 (誤った判定)</text>
    <rect x="0" y="8" width="500" height="40" rx="4" fill="#fef2f2" stroke="#dc2626" stroke-width="2" filter="url(#shadow)"/>

    <g transform="translate(60, 28)">
      <rect x="-40" y="-10" width="80" height="22" rx="3" fill="#dc2626"/>
      <text x="0" y="5" text-anchor="middle" font-size="12" font-weight="700" fill="white" font-family="monospace">110M</text>
    </g>
    <text x="60" y="44" text-anchor="middle" font-size="9" fill="#7f1d1d">reserve 全体</text>

    <text x="170" y="33" text-anchor="middle" font-size="20" font-weight="900" fill="#dc2626">&gt;</text>

    <g transform="translate(280, 28)">
      <rect x="-40" y="-10" width="80" height="22" rx="3" fill="#fff" stroke="#059669" stroke-width="2"/>
      <text x="0" y="5" text-anchor="middle" font-size="12" font-weight="700" fill="#059669" font-family="monospace">50M</text>
    </g>
    <text x="280" y="44" text-anchor="middle" font-size="9" fill="#065f46">Group A 閾値</text>

    <text x="395" y="33" text-anchor="middle" font-size="14" font-weight="700" fill="#dc2626">→ ADL 発動</text>
  </g>

  <!-- arrow from reserve down to scale -->
  <path d="M 485 332 L 320 350" stroke="#dc2626" stroke-width="2" fill="none" marker-end="url(#arr)" stroke-dasharray="4,3"/>

  <!-- lightning + broken vault outcome -->
  <g transform="translate(620, 340)">
    <path d="M 0 32 L 50 22 L 30 22 L 60 12" stroke="#dc2626" stroke-width="2.5" fill="none" marker-end="url(#arr)"/>

    <g transform="translate(70, 0)">
      <path d="M 16 0 L 0 28 L 14 28 L 4 52 L 30 18 L 16 18 L 26 0 Z" fill="#fbbf24" stroke="#b45309" stroke-width="1.8"/>
    </g>

    <g transform="translate(110, 10)" filter="url(#shadow)">
      <path d="M 5 5 L 95 5 L 100 12 L 90 18 L 100 24 L 90 30 L 95 38 L 5 38 Z" fill="#fee2e2" stroke="#dc2626" stroke-width="2" stroke-dasharray="3,2"/>
      <text x="50" y="20" text-anchor="middle" font-size="11" font-weight="700" fill="#7f1d1d" font-family="monospace">stSUI 金庫</text>
      <text x="50" y="33" text-anchor="middle" font-size="11" font-weight="700" fill="#dc2626">⚠ 破壊</text>
    </g>

    <text x="220" y="28" font-size="12" font-weight="700" fill="#dc2626">顧客 A 強制清算</text>
    <text x="220" y="42" font-size="10" fill="#7f1d1d">健全だったのに巻き添え</text>
  </g>
</svg>
