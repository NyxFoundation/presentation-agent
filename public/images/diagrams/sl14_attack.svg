<svg viewBox="0 0 980 420" xmlns="http://www.w3.org/2000/svg" font-family="'Noto Sans JP', system-ui, sans-serif">
  <defs>
    <marker id="ar" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto"><path d="M0,0 L9,3 L0,6 Z" fill="#374151"/></marker>
    <marker id="arb" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto"><path d="M0,0 L9,3 L0,6 Z" fill="#2563eb"/></marker>
    <marker id="arg" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto"><path d="M0,0 L9,3 L0,6 Z" fill="#6b7280"/></marker>
    <marker id="arr" markerWidth="12" markerHeight="12" refX="10" refY="4" orient="auto"><path d="M0,0 L10,4 L0,8 Z" fill="#dc2626"/></marker>
    <marker id="arr2" markerWidth="12" markerHeight="12" refX="10" refY="4" orient="auto"><path d="M0,0 L10,4 L0,8 Z" fill="#059669"/></marker>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="2" stdDeviation="2" flood-opacity="0.18"/>
    </filter>
  </defs>

  <!-- ========== LEFT SIDE: scenario scene (compact) ========== -->
  <!-- CUSTOMER A -->
  <g>
    <rect x="20" y="6" width="130" height="18" rx="9" fill="#2563eb"/>
    <text x="85" y="19" text-anchor="middle" fill="white" font-size="11" font-weight="700">Group A · LST</text>
    <circle cx="45" cy="50" r="11" fill="#2563eb"/>
    <path d="M 34 60 Q 45 58 56 60 L 54 82 L 36 82 Z" fill="#2563eb"/>
    <text x="45" y="98" text-anchor="middle" font-size="12" font-weight="700" fill="#111827">顧客 A</text>
    <path d="M 62 70 Q 95 68 125 75" stroke="#1e40af" stroke-width="1.6" fill="none" marker-end="url(#arb)"/>
    <text x="93" y="63" text-anchor="middle" font-size="9" fill="#1e40af">担保</text>
    <g transform="translate(125, 38)" filter="url(#shadow)">
      <path d="M 5 22 Q 50 4 95 22" fill="#bfdbfe" stroke="#1e40af" stroke-width="2"/>
      <rect x="5" y="22" width="90" height="48" rx="3" fill="#dbeafe" stroke="#1e40af" stroke-width="2"/>
      <line x1="5" y1="36" x2="95" y2="36" stroke="#1e40af" stroke-width="1.4"/>
      <rect x="40" y="32" width="18" height="14" rx="2" fill="#1e40af"/>
      <circle cx="49" cy="40" r="2" fill="#fbbf24"/>
      <text x="50" y="60" text-anchor="middle" font-size="11" font-weight="700" fill="#1e3a8a" font-family="monospace">stSUI 50M</text>
    </g>
  </g>

  <!-- CUSTOMER B (mirror right) -->
  <g>
    <rect x="350" y="6" width="130" height="18" rx="9" fill="#6b7280"/>
    <text x="415" y="19" text-anchor="middle" fill="white" font-size="11" font-weight="700">Group B · ETH</text>
    <circle cx="455" cy="50" r="11" fill="#6b7280"/>
    <path d="M 444 60 Q 455 58 466 60 L 464 82 L 446 82 Z" fill="#6b7280"/>
    <text x="455" y="98" text-anchor="middle" font-size="12" font-weight="700" fill="#111827">顧客 B</text>
    <path d="M 438 70 Q 405 68 375 75" stroke="#4b5563" stroke-width="1.6" fill="none" marker-end="url(#arg)"/>
    <text x="407" y="63" text-anchor="middle" font-size="9" fill="#4b5563">担保</text>
    <g transform="translate(280, 38)" filter="url(#shadow)">
      <path d="M 5 22 Q 50 4 95 22" fill="#e5e7eb" stroke="#4b5563" stroke-width="2"/>
      <rect x="5" y="22" width="90" height="48" rx="3" fill="#f3f4f6" stroke="#4b5563" stroke-width="2"/>
      <line x1="5" y1="36" x2="95" y2="36" stroke="#4b5563" stroke-width="1.4"/>
      <rect x="40" y="32" width="18" height="14" rx="2" fill="#4b5563"/>
      <circle cx="49" cy="40" r="2" fill="#fbbf24"/>
      <text x="50" y="60" text-anchor="middle" font-size="11" font-weight="700" fill="#1f2937" font-family="monospace">wETH 100M</text>
    </g>
  </g>

  <!-- BORROW arrows -->
  <text x="135" y="135" text-anchor="middle" font-size="11" fill="#1e40af" font-weight="700">借入 USDC 30M</text>
  <path d="M 135 142 Q 200 175 250 210" stroke="#2563eb" stroke-width="2.5" fill="none" marker-end="url(#arb)" stroke-dasharray="5,4"/>
  <circle cx="180" cy="160" r="8" fill="#fbbf24" stroke="#92400e" stroke-width="1.2"/>
  <text x="180" y="164" text-anchor="middle" font-size="10" font-weight="700" fill="#92400e">$</text>

  <text x="365" y="135" text-anchor="middle" font-size="11" fill="#4b5563" font-weight="700">借入 USDC 80M</text>
  <path d="M 365 142 Q 320 175 280 210" stroke="#6b7280" stroke-width="2.5" fill="none" marker-end="url(#arg)" stroke-dasharray="5,4"/>
  <circle cx="335" cy="160" r="8" fill="#fbbf24" stroke="#92400e" stroke-width="1.2"/>
  <text x="335" y="164" text-anchor="middle" font-size="10" font-weight="700" fill="#92400e">$</text>

  <!-- Reserve vault -->
  <g transform="translate(135, 215)" filter="url(#shadow)">
    <path d="M 8 24 Q 115 0 225 24" fill="#374151" stroke="#000" stroke-width="2.5"/>
    <text x="115" y="17" text-anchor="middle" font-size="11" font-weight="700" fill="#fff">USDC reserve</text>
    <rect x="8" y="24" width="220" height="68" rx="5" fill="#1f2937" stroke="#000" stroke-width="2.5"/>
    <rect x="106" y="20" width="20" height="14" rx="2" fill="#fbbf24" stroke="#000" stroke-width="1"/>
    <circle cx="115" cy="27" r="2" fill="#000"/>
    <text x="115" y="58" text-anchor="middle" font-size="18" font-weight="900" fill="#fbbf24" font-family="monospace">30M + 80M</text>
    <text x="115" y="80" text-anchor="middle" font-size="18" font-weight="900" fill="#fef3c7" font-family="monospace">= 110M</text>
  </g>

  <!-- Red halo on reserve (showing where :580 reads) -->
  <ellipse cx="250" cy="270" rx="135" ry="55" fill="none" stroke="#dc2626" stroke-width="3" stroke-dasharray="6,3"/>
  <text x="250" y="345" text-anchor="middle" font-size="11" font-weight="700" fill="#dc2626">↑ :580 が読んだ場所</text>

  <!-- Green halo on customer A's borrow arrow (showing where :686 reads) -->
  <ellipse cx="180" cy="160" rx="35" ry="22" fill="none" stroke="#059669" stroke-width="2.5" stroke-dasharray="5,3"/>
  <text x="40" y="200" font-size="11" font-weight="700" fill="#059669">本来 :686 のように</text>
  <text x="40" y="215" font-size="11" font-weight="700" fill="#059669">ここだけを見るべき</text>

  <!-- DIVIDER -->
  <line x1="500" y1="20" x2="500" y2="440" stroke="#e5e7eb" stroke-width="1.5" stroke-dasharray="3,3"/>

  <!-- ========== RIGHT SIDE: code panel (3 management points) ========== -->
  <g>
    <!-- Function header -->
    <rect x="520" y="4" width="450" height="28" rx="3" fill="#1f2937"/>
    <text x="535" y="22" font-size="11" font-family="monospace" fill="#fbbf24">fn </text>
    <text x="555" y="22" font-size="11" font-family="monospace" fill="#ffffff" font-weight="700">handle_debt_auto_deleverage</text>
    <text x="795" y="22" font-size="11" font-family="monospace" fill="#9ca3af">  // market.move :546</text>

    <!-- :575 register -->
    <g transform="translate(520, 48)">
      <rect x="0" y="0" width="450" height="62" rx="3" fill="#ecfdf5" stroke="#059669" stroke-width="2" filter="url(#shadow)"/>
      <rect x="0" y="0" width="56" height="62" rx="3" fill="#059669"/>
      <text x="28" y="22" text-anchor="middle" font-size="10" font-family="monospace" fill="white" font-weight="700">:575</text>
      <text x="28" y="40" text-anchor="middle" font-size="14" fill="white" font-weight="700">✓</text>
      <text x="28" y="55" text-anchor="middle" font-size="9" fill="white">登録</text>
      <text x="68" y="22" font-size="11" font-family="monospace" fill="#064e3b">adl_registry.get_borrow_deleverage(</text>
      <text x="78" y="36" font-size="11" font-family="monospace" fill="#064e3b">debt_type, <tspan font-weight="700" fill="#059669">emode_group_id</tspan>);</text>
      <text x="68" y="54" font-size="10" fill="#065f46">→ Group A だけを対象に登録 (正)</text>
    </g>

    <!-- :580 EXECUTE (BUG) -->
    <g transform="translate(520, 122)">
      <rect x="0" y="0" width="450" height="78" rx="3" fill="#fef2f2" stroke="#dc2626" stroke-width="3" filter="url(#shadow)"/>
      <rect x="0" y="0" width="56" height="78" rx="3" fill="#dc2626"/>
      <text x="28" y="22" text-anchor="middle" font-size="10" font-family="monospace" fill="white" font-weight="700">:580</text>
      <text x="28" y="42" text-anchor="middle" font-size="18" fill="white" font-weight="700">❌</text>
      <text x="28" y="60" text-anchor="middle" font-size="9" fill="white">実行</text>
      <text x="28" y="72" text-anchor="middle" font-size="8" fill="white">BUG</text>
      <text x="68" y="22" font-size="11" font-family="monospace" fill="#7f1d1d">let total_debt = self.<tspan font-weight="700">reserves</tspan></text>
      <text x="78" y="36" font-size="11" font-family="monospace" fill="#7f1d1d">.load_by_type(debt_type)</text>
      <text x="78" y="50" font-size="11" font-family="monospace" fill="#7f1d1d">.<tspan font-weight="700" fill="#dc2626">debt()</tspan>  <tspan fill="#9ca3af" font-size="10">// 全体合計</tspan></text>
      <text x="68" y="70" font-size="10" font-weight="700" fill="#7f1d1d">→ reserve 全体の 110M を読んでしまう ← BUG</text>
    </g>

    <!-- :686 stop -->
    <g transform="translate(520, 212)">
      <rect x="0" y="0" width="450" height="62" rx="3" fill="#ecfdf5" stroke="#059669" stroke-width="2" filter="url(#shadow)"/>
      <rect x="0" y="0" width="56" height="62" rx="3" fill="#059669"/>
      <text x="28" y="22" text-anchor="middle" font-size="10" font-family="monospace" fill="white" font-weight="700">:686</text>
      <text x="28" y="40" text-anchor="middle" font-size="14" fill="white" font-weight="700">✓</text>
      <text x="28" y="55" text-anchor="middle" font-size="9" fill="white">停止</text>
      <text x="68" y="22" font-size="11" font-family="monospace" fill="#064e3b">let total_borrow = <tspan font-weight="700" fill="#059669">emode_group</tspan></text>
      <text x="78" y="36" font-size="11" font-family="monospace" fill="#064e3b">.borrow_amount(debt_type);</text>
      <text x="68" y="54" font-size="10" fill="#065f46">→ Group A の借入だけを読む (正)</text>
    </g>

    <!-- Verdict banner -->
    <g transform="translate(520, 290)">
      <rect x="0" y="0" width="450" height="48" rx="4" fill="#fef3c7" stroke="#b45309" stroke-width="2" filter="url(#shadow)"/>
      <text x="14" y="20" font-size="12" font-weight="700" fill="#78350f">3 箇所のうち <tspan fill="#dc2626" font-weight="900">:580 だけ</tspan> が違う粒度を読んだ</text>
      <text x="14" y="38" font-size="11" fill="#78350f">→ <tspan font-family="monospace">.debt()</tspan> ではなく <tspan font-family="monospace" font-weight="700">.borrow_amount(emode_group_id)</tspan> が正解</text>
    </g>

    <!-- Banking analog -->
    <g transform="translate(520, 345)">
      <rect x="0" y="0" width="450" height="58" rx="4" fill="#fff" stroke="#9ca3af" stroke-width="1.5" stroke-dasharray="4,3"/>
      <text x="14" y="18" font-size="10" font-weight="700" fill="#374151">皆様の言葉で</text>
      <text x="14" y="34" font-size="10" fill="#374151">顧客別の与信枠を3箇所で参照 ─ 強制執行トリガーだけが <tspan font-weight="700">銀行全体の融資残高</tspan>と比較</text>
      <text x="14" y="50" font-size="9" fill="#6b7280">= コントロール粒度の不整合 ／ ITGC-CC04 / FISC 統83 相当</text>
    </g>
  </g>

  <!-- CONNECTION lines: from :580 panel to red halo -->
  <path d="M 520 165 Q 450 200 380 270" stroke="#dc2626" stroke-width="2" fill="none" stroke-dasharray="5,3" marker-end="url(#arr)" opacity="0.7"/>

  <!-- CONNECTION lines: from :686 panel to green halo -->
  <path d="M 520 245 Q 360 220 215 165" stroke="#059669" stroke-width="2" fill="none" stroke-dasharray="5,3" marker-end="url(#arr2)" opacity="0.7"/>
</svg>
