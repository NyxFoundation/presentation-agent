<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 940 480" font-family="Noto Sans JP, sans-serif">
  <defs>
    <linearGradient id="src" x1="0" x2="1" y1="0" y2="1"><stop offset="0" stop-color="#fff"/><stop offset="1" stop-color="#e6efff"/></linearGradient>
    <linearGradient id="dst" x1="0" x2="1" y1="0" y2="1"><stop offset="0" stop-color="#fff"/><stop offset="1" stop-color="#fee6e6"/></linearGradient>
    <filter id="ksh"><feDropShadow dx="0" dy="2" stdDeviation="3" flood-opacity="0.18"/></filter>
    <marker id="kah" markerWidth="9" markerHeight="9" refX="8" refY="3" orient="auto"><path d="M0,0 L0,6 L8,3 z" fill="#cc3333"/></marker>
    <marker id="kah2" markerWidth="9" markerHeight="9" refX="8" refY="3" orient="auto"><path d="M0,0 L0,6 L8,3 z" fill="#2a5db0"/></marker>
  </defs>

  <text x="30" y="34" font-size="18" font-weight="700">KelpDAO × LayerZero $292M Exploit — オフチェーン構成要素の侵害</text>
  <text x="30" y="54" font-size="12" fill="#555">April 18, 2026 / Attribution: Lazarus Group · TraderTraitor (LayerZero 公式発表)</text>

  <!-- Source chain (left) -->
  <rect x="30" y="80" width="280" height="350" rx="12" fill="url(#src)" stroke="#2a5db0" filter="url(#ksh)"/>
  <text x="170" y="108" text-anchor="middle" font-size="14" font-weight="700" fill="#2a5db0">Source Chain (L2)</text>
  <rect x="60" y="130" width="220" height="40" rx="6" fill="#fff" stroke="#2a5db0"/>
  <text x="170" y="155" text-anchor="middle" font-size="12">rsETH Bridge Contract</text>

  <rect x="60" y="190" width="220" height="60" rx="6" fill="#fff" stroke="#2a5db0"/>
  <text x="170" y="213" text-anchor="middle" font-size="12" font-weight="600">RPC Node Pool</text>
  <text x="170" y="232" text-anchor="middle" font-size="11" fill="#555">verifier の参照先</text>

  <!-- compromised RPCs -->
  <rect x="60" y="260" width="100" height="50" rx="6" fill="#fee" stroke="#cc3333"/>
  <text x="110" y="282" text-anchor="middle" font-size="11" font-weight="700" fill="#cc3333">RPC #1</text>
  <text x="110" y="298" text-anchor="middle" font-size="10" fill="#cc3333">バイナリ置換</text>

  <rect x="180" y="260" width="100" height="50" rx="6" fill="#fee" stroke="#cc3333"/>
  <text x="230" y="282" text-anchor="middle" font-size="11" font-weight="700" fill="#cc3333">RPC #2</text>
  <text x="230" y="298" text-anchor="middle" font-size="10" fill="#cc3333">バイナリ置換</text>

  <rect x="60" y="325" width="220" height="50" rx="6" fill="#f4f4f4" stroke="#888"/>
  <text x="170" y="347" text-anchor="middle" font-size="11" font-weight="600" fill="#555">RPC #3, #4 (external)</text>
  <text x="170" y="363" text-anchor="middle" font-size="10" fill="#cc3333">DDoS で落とされる → failover</text>

  <!-- Verifier middle -->
  <rect x="350" y="120" width="240" height="250" rx="12" fill="#ffffff" stroke="#444" filter="url(#ksh)"/>
  <text x="470" y="146" text-anchor="middle" font-size="14" font-weight="700">LayerZero Verifier (DVN)</text>
  <text x="470" y="166" text-anchor="middle" font-size="11" fill="#666">1-of-1 DVN = 単一障害点</text>

  <rect x="370" y="190" width="200" height="160" rx="8" fill="#fafafa" stroke="#888"/>
  <text x="470" y="216" text-anchor="middle" font-size="12" font-weight="700">RPC を参照して</text>
  <text x="470" y="234" text-anchor="middle" font-size="12" font-weight="700">message を「検証」</text>
  <text x="470" y="265" text-anchor="middle" font-size="11" fill="#cc3333">↓ 侵害 RPC を信用</text>
  <text x="470" y="290" text-anchor="middle" font-size="11" fill="#cc3333">偽の cross-chain msg を</text>
  <text x="470" y="307" text-anchor="middle" font-size="11" fill="#cc3333">"valid" として承認</text>

  <!-- Destination chain -->
  <rect x="630" y="80" width="280" height="350" rx="12" fill="url(#dst)" stroke="#cc3333" filter="url(#ksh)"/>
  <text x="770" y="108" text-anchor="middle" font-size="14" font-weight="700" fill="#cc3333">Destination Chain (Ethereum)</text>
  <rect x="660" y="130" width="220" height="40" rx="6" fill="#fff" stroke="#cc3333"/>
  <text x="770" y="155" text-anchor="middle" font-size="12">rsETH Release Contract</text>

  <rect x="660" y="200" width="220" height="60" rx="6" fill="#fff" stroke="#cc3333"/>
  <text x="770" y="223" text-anchor="middle" font-size="12" font-weight="600">「burn が起きた」と</text>
  <text x="770" y="242" text-anchor="middle" font-size="12" font-weight="600">信じて release</text>

  <rect x="660" y="285" width="220" height="80" rx="6" fill="#cc3333" stroke="#cc3333"/>
  <text x="770" y="312" text-anchor="middle" font-size="14" font-weight="700" fill="#fff">116,500 rsETH 流出</text>
  <text x="770" y="335" text-anchor="middle" font-size="13" fill="#fff">≈ $292M</text>
  <text x="770" y="356" text-anchor="middle" font-size="11" fill="#fff">+ Aave 連鎖で $8.45B 蒸発</text>

  <!-- arrows -->
  <line x1="280" y1="285" x2="350" y2="260" stroke="#cc3333" stroke-width="2.5" marker-end="url(#kah)"/>
  <line x1="590" y1="220" x2="660" y2="220" stroke="#2a5db0" stroke-width="2.5" marker-end="url(#kah2)"/>
  <text x="615" y="208" font-size="11" fill="#2a5db0">"valid"</text>

  <!-- Bottom note -->
  <rect x="30" y="445" width="880" height="30" rx="6" fill="#f5f5f5" stroke="#333"/>
  <text x="42" y="464" font-size="12">スマートコントラクトは全部 valid に動いた — 監査の射程外、オフチェーン RPC が攻撃面。</text>
</svg>
