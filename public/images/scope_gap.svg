<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 460" font-family="Noto Sans JP, sans-serif">
  <defs>
    <linearGradient id="atkG" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#fff5f5"/>
      <stop offset="1" stop-color="#fde2e2"/>
    </linearGradient>
    <linearGradient id="defG" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#eef6ff"/>
      <stop offset="1" stop-color="#d7e8ff"/>
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-opacity="0.18"/>
    </filter>
  </defs>

  <!-- ATTACK SURFACE (large) -->
  <rect x="40" y="40" width="820" height="380" rx="18" fill="url(#atkG)" stroke="#cc3333" stroke-width="2" filter="url(#shadow)"/>
  <text x="60" y="78" font-size="20" font-weight="700" fill="#cc3333">攻撃側のスコープ (Attack Surface)</text>
  <text x="60" y="100" font-size="13" fill="#8a3333">国家アクター・AI 無人化攻撃を含む、現実の攻撃面</text>

  <!-- attack tiles -->
  <g font-size="14" fill="#1a1a1a">
    <rect x="60" y="120" width="170" height="60" rx="8" fill="#ffffff" stroke="#cc3333"/>
    <text x="145" y="148" text-anchor="middle" font-weight="600">ソースコード</text>
    <text x="145" y="167" text-anchor="middle" font-size="11" fill="#666">smart contract</text>

    <rect x="240" y="120" width="170" height="60" rx="8" fill="#ffffff" stroke="#cc3333"/>
    <text x="325" y="148" text-anchor="middle" font-weight="600">ガバナンス</text>
    <text x="325" y="167" text-anchor="middle" font-size="11" fill="#666">multisig / DAO 投票</text>

    <rect x="420" y="120" width="180" height="60" rx="8" fill="#ffffff" stroke="#cc3333"/>
    <text x="510" y="148" text-anchor="middle" font-weight="600">ソーシャル工学</text>
    <text x="510" y="167" text-anchor="middle" font-size="11" fill="#666">phishing / impersonation</text>

    <rect x="610" y="120" width="220" height="60" rx="8" fill="#ffffff" stroke="#cc3333"/>
    <text x="720" y="148" text-anchor="middle" font-weight="600">オペレーション</text>
    <text x="720" y="167" text-anchor="middle" font-size="11" fill="#666">KMS / RPC node / CI</text>

    <rect x="60" y="200" width="280" height="60" rx="8" fill="#ffffff" stroke="#cc3333"/>
    <text x="200" y="228" text-anchor="middle" font-weight="600">ウォレット UI / フロント</text>
    <text x="200" y="247" text-anchor="middle" font-size="11" fill="#666">Bybit \$1.5B 事例</text>

    <rect x="350" y="200" width="250" height="60" rx="8" fill="#ffffff" stroke="#cc3333"/>
    <text x="475" y="228" text-anchor="middle" font-weight="600">AI 無人化攻撃</text>
    <text x="475" y="247" text-anchor="middle" font-size="11" fill="#666">Claude Code 悪用 (MX 政府事例)</text>

    <rect x="610" y="200" width="220" height="60" rx="8" fill="#ffffff" stroke="#cc3333"/>
    <text x="720" y="228" text-anchor="middle" font-weight="600">クロスチェーンBridge</text>
    <text x="720" y="247" text-anchor="middle" font-size="11" fill="#666">KelpDAO×LayerZero</text>
  </g>

  <!-- DEFENSE SCOPE (small, inside) -->
  <rect x="60" y="290" width="380" height="110" rx="14" fill="url(#defG)" stroke="#2a5db0" stroke-width="2" filter="url(#shadow)"/>
  <text x="80" y="320" font-size="17" font-weight="700" fill="#2a5db0">防御側のスコープ (バグバウンティ / 監査)</text>
  <g font-size="12" fill="#1a1a1a">
    <text x="80" y="345">• ソースコード (smart contract)</text>
    <text x="80" y="365">• 既知の脆弱性パターン</text>
    <text x="80" y="385">• オンチェーンのロジック</text>
  </g>

  <!-- gap label -->
  <g>
    <line x1="445" y1="345" x2="600" y2="345" stroke="#cc3333" stroke-width="2.5" stroke-dasharray="6 4" marker-end="url(#arrow)"/>
    <defs>
      <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto">
        <path d="M0,0 L0,6 L9,3 z" fill="#cc3333"/>
      </marker>
    </defs>
    <text x="470" y="335" font-size="18" font-weight="700" fill="#cc3333">スコープ乖離 = 攻撃の侵入路</text>
    <text x="470" y="375" font-size="12" fill="#8a3333">監査では絶対に届かない領域</text>
  </g>
</svg>
