<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" font-family="Noto Sans JP, sans-serif">
  <defs>
    <radialGradient id="atkBG" cx="50%" cy="50%" r="65%">
      <stop offset="0%" stop-color="#fff" stop-opacity="0"/>
      <stop offset="70%" stop-color="#fee2e2" stop-opacity="0.6"/>
      <stop offset="100%" stop-color="#fecaca" stop-opacity="0.85"/>
    </radialGradient>
    <radialGradient id="defBG" cx="50%" cy="50%" r="65%">
      <stop offset="0%" stop-color="#dbeafe" stop-opacity="0.95"/>
      <stop offset="100%" stop-color="#bfdbfe" stop-opacity="0.95"/>
    </radialGradient>
    <filter id="dropsoft" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-opacity="0.15"/>
    </filter>
    <marker id="redArrow" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto">
      <path d="M0,0 L0,6 L9,3 z" fill="#cc3333"/>
    </marker>
  </defs>

  <!-- ===== OUTER: ATTACK SURFACE (large ellipse) ===== -->
  <ellipse cx="480" cy="290" rx="430" ry="220" fill="url(#atkBG)" stroke="#cc3333" stroke-width="2.5" filter="url(#dropsoft)"/>

  <!-- Attack surface label (top of outer) -->
  <text x="480" y="105" text-anchor="middle" font-size="20" font-weight="700" fill="#cc3333">攻撃側のスコープ (Attack Surface)</text>
  <text x="480" y="128" text-anchor="middle" font-size="12" fill="#8a3333">国家アクター・AI 無人化攻撃を含む、現実の攻撃面</text>

  <!-- ===== INNER: DEFENSE SCOPE (smaller ellipse inside attack) ===== -->
  <ellipse cx="320" cy="320" rx="180" ry="115" fill="url(#defBG)" stroke="#2a5db0" stroke-width="2.5" filter="url(#dropsoft)"/>

  <!-- Defense label (centered in inner ellipse) -->
  <text x="320" y="265" text-anchor="middle" font-size="15" font-weight="700" fill="#2a5db0">防御側のスコープ</text>
  <text x="320" y="284" text-anchor="middle" font-size="11" fill="#2a5db0">バグバウンティ / 監査</text>

  <!-- Defense items (inside inner ellipse only) -->
  <g font-size="12" fill="#1f3a72">
    <text x="320" y="312" text-anchor="middle">&#9679; ソースコード (smart contract)</text>
    <text x="320" y="334" text-anchor="middle">&#9679; 既知の脆弱性パターン</text>
    <text x="320" y="356" text-anchor="middle">&#9679; オンチェーンのロジック</text>
  </g>

  <!-- ===== ATTACK-ONLY items (in attack area but outside defense) ===== -->
  <!-- Top region: 3 items above defense oval -->
  <g font-size="12" fill="#1a1a1a">
    <!-- Top-left of attack, near governance/social -->
    <g>
      <rect x="180" y="155" width="160" height="42" rx="8" fill="#ffffff" stroke="#cc3333" stroke-width="1.2"/>
      <text x="260" y="174" text-anchor="middle" font-size="13" font-weight="600">ガバナンス</text>
      <text x="260" y="190" text-anchor="middle" font-size="10" fill="#666">multisig / DAO 投票</text>
    </g>

    <g>
      <rect x="360" y="155" width="170" height="42" rx="8" fill="#ffffff" stroke="#cc3333" stroke-width="1.2"/>
      <text x="445" y="174" text-anchor="middle" font-size="13" font-weight="600">ソーシャル工学</text>
      <text x="445" y="190" text-anchor="middle" font-size="10" fill="#666">phishing / impersonation</text>
    </g>

    <g>
      <rect x="550" y="155" width="200" height="42" rx="8" fill="#ffffff" stroke="#cc3333" stroke-width="1.2"/>
      <text x="650" y="174" text-anchor="middle" font-size="13" font-weight="600">オペレーション</text>
      <text x="650" y="190" text-anchor="middle" font-size="10" fill="#666">KMS / RPC node / CI</text>
    </g>

    <!-- Right region: 3 items right of defense oval -->
    <g>
      <rect x="540" y="230" width="200" height="42" rx="8" fill="#ffffff" stroke="#cc3333" stroke-width="1.2"/>
      <text x="640" y="249" text-anchor="middle" font-size="13" font-weight="600">ウォレット UI / フロント</text>
      <text x="640" y="265" text-anchor="middle" font-size="10" fill="#666">Bybit $1.5B 事例</text>
    </g>

    <g>
      <rect x="550" y="290" width="180" height="42" rx="8" fill="#ffffff" stroke="#cc3333" stroke-width="1.2"/>
      <text x="640" y="309" text-anchor="middle" font-size="13" font-weight="600">AI 無人化攻撃</text>
      <text x="640" y="325" text-anchor="middle" font-size="10" fill="#666">MX 政府事例</text>
    </g>

    <g>
      <rect x="540" y="350" width="200" height="42" rx="8" fill="#ffffff" stroke="#cc3333" stroke-width="1.2"/>
      <text x="640" y="369" text-anchor="middle" font-size="13" font-weight="600">クロスチェーン Bridge</text>
      <text x="640" y="385" text-anchor="middle" font-size="10" fill="#666">KelpDAO × LayerZero</text>
    </g>
  </g>

  <!-- ===== GAP LABEL (between defense ellipse and attack-only items) ===== -->
  <g>
    <line x1="505" y1="320" x2="535" y2="320" stroke="#cc3333" stroke-width="2.5" stroke-dasharray="5 3" marker-end="url(#redArrow)"/>
  </g>

  <!-- Bottom annotation -->
  <rect x="60" y="455" width="840" height="60" rx="8" fill="#f9fafb" stroke="#374151" stroke-width="1"/>
  <text x="480" y="478" text-anchor="middle" font-size="13" font-weight="700" fill="#cc3333">スコープ乖離 = 攻撃側にしか見えていない領域</text>
  <text x="480" y="500" text-anchor="middle" font-size="11" fill="#555">監査・バグバウンティでは原理的に届かない — ここを暗号で検証可能にするしかない</text>
</svg>
