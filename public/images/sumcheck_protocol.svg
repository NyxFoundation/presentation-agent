<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 940 460" font-family="Noto Sans JP, sans-serif">
  <defs>
    <filter id="ss" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-opacity="0.18"/>
    </filter>
  </defs>

  <!-- Title -->
  <text x="30" y="36" font-size="18" font-weight="700" fill="#111">Sumcheck Protocol — Σ f(x₁,…,xₙ) を verifier に「少ない通信」で確信させる</text>
  <text x="30" y="56" font-size="12" fill="#555">[Lund, Fortnow, Karloff, Nisan. JACM 39(4), 1992]</text>

  <!-- prover / verifier columns -->
  <rect x="30" y="80" width="380" height="350" rx="10" fill="#fafafa" stroke="#222" filter="url(#ss)"/>
  <rect x="530" y="80" width="380" height="350" rx="10" fill="#fafafa" stroke="#222" filter="url(#ss)"/>
  <text x="220" y="105" text-anchor="middle" font-weight="700" font-size="16" fill="#222">Prover</text>
  <text x="720" y="105" text-anchor="middle" font-weight="700" font-size="16" fill="#222">Verifier</text>

  <!-- Round 1 -->
  <rect x="50" y="125" width="340" height="62" rx="6" fill="#fff7e6" stroke="#b8860b"/>
  <text x="60" y="148" font-size="13" font-weight="600">Round 1</text>
  <text x="60" y="168" font-size="12">g₁(X) = Σ_{x₂,…,xₙ} f(X, x₂,…,xₙ)</text>
  <text x="60" y="182" font-size="11" fill="#555">1変数多項式に集約</text>

  <line x1="395" y1="155" x2="530" y2="155" stroke="#444" stroke-width="2" marker-end="url(#ah)"/>
  <defs><marker id="ah" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="#444"/></marker></defs>
  <text x="463" y="148" text-anchor="middle" font-size="11" fill="#444">g₁(X)</text>

  <rect x="550" y="125" width="340" height="62" rx="6" fill="#eef6ff" stroke="#2a5db0"/>
  <text x="560" y="148" font-size="13" font-weight="600">Check 1</text>
  <text x="560" y="168" font-size="12">g₁(0)+g₁(1) ?= 主張値 H</text>
  <text x="560" y="182" font-size="11" fill="#444">ランダム r₁ ∈ 𝔽 を返す</text>

  <line x1="550" y1="220" x2="395" y2="220" stroke="#444" stroke-width="2" marker-end="url(#ah)"/>
  <text x="463" y="213" text-anchor="middle" font-size="11" fill="#444">r₁</text>

  <!-- Round i -->
  <rect x="50" y="200" width="340" height="62" rx="6" fill="#fff7e6" stroke="#b8860b"/>
  <text x="60" y="223" font-size="13" font-weight="600">Round i</text>
  <text x="60" y="243" font-size="12">gᵢ(X) = Σ f(r₁,…,r_{i-1}, X, x_{i+1},…)</text>

  <line x1="395" y1="230" x2="530" y2="230" stroke="#444" stroke-width="2" marker-end="url(#ah)"/>
  <text x="463" y="223" text-anchor="middle" font-size="11" fill="#444">gᵢ(X)</text>

  <rect x="550" y="200" width="340" height="62" rx="6" fill="#eef6ff" stroke="#2a5db0"/>
  <text x="560" y="223" font-size="13" font-weight="600">Check i</text>
  <text x="560" y="243" font-size="12">gᵢ(0)+gᵢ(1) ?= g_{i-1}(r_{i-1})</text>
  <text x="560" y="257" font-size="11" fill="#444">ランダム rᵢ ∈ 𝔽 を返す</text>

  <line x1="550" y1="295" x2="395" y2="295" stroke="#444" stroke-width="2" marker-end="url(#ah)"/>
  <text x="463" y="288" text-anchor="middle" font-size="11" fill="#444">rᵢ</text>

  <!-- Final -->
  <rect x="50" y="275" width="340" height="80" rx="6" fill="#fff7e6" stroke="#b8860b"/>
  <text x="60" y="298" font-size="13" font-weight="600">Final Round</text>
  <text x="60" y="318" font-size="12">f(r₁,r₂,…,rₙ) を実際に評価</text>
  <text x="60" y="338" font-size="11" fill="#555">単一点での評価 → commitment と比較</text>

  <rect x="550" y="275" width="340" height="80" rx="6" fill="#eef6ff" stroke="#2a5db0"/>
  <text x="560" y="298" font-size="13" font-weight="600">Final Check</text>
  <text x="560" y="318" font-size="12">commitment から f(r) を open</text>
  <text x="560" y="338" font-size="11" fill="#444">gₙ(rₙ) ?= f(r) なら accept</text>

  <!-- Intuition box -->
  <rect x="50" y="375" width="840" height="42" rx="6" fill="#f5f5f5" stroke="#333"/>
  <text x="60" y="397" font-size="12" font-weight="700">直感:</text>
  <text x="120" y="397" font-size="12">高次元の総和を、1次元ずつランダム点で「ピン留め」していき、最後の1点だけ実評価して整合性を担保する。</text>
  <text x="120" y="412" font-size="11" fill="#555">→ Schwartz–Zippel に基づく soundness</text>
</svg>
